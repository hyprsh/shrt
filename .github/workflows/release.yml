name: release
# A vX.Y.Z tag publishes ghcr.io/hyprsh/shrt for linux/amd64 and linux/arm64,
# with a GitHub artifact attestation (check with `gh attestation verify`).
# The GitHub release itself is made by `go run ./cmd/release`.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
permissions:
  contents: read
  packages: write # ghcr.io
  id-token: write # attestations are signed with the workflow's identity
  attestations: write
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: scripts/check.sh
      # The tag is a plain vX.Y.Z, so X.Y.Z, X.Y, X and latest are all its own.
      - id: version
        run: |
          version=${GITHUB_REF_NAME#v}
          minor=${version%.*}
          {
            echo "version=$version"
            echo "tags<<EOF"
            echo "ghcr.io/hyprsh/shrt:$version"
            echo "ghcr.io/hyprsh/shrt:$minor"
            echo "ghcr.io/hyprsh/shrt:${minor%.*}"
            echo "ghcr.io/hyprsh/shrt:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false # attested below
          build-args: VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.version.outputs.tags }}
          labels: org.opencontainers.image.source=https://github.com/hyprsh/shrt
      - uses: actions/attest-build-provenance@v3
        with:
          subject-name: ghcr.io/hyprsh/shrt
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
